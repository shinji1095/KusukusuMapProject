version: "3.9"
services:
  app:
    build: .
    container_name: map_publish_app
    env_file: .env
    command: gunicorn --bind 0.0.0.0:8080 config.wsgi:application --timeout 300
  nginx:
    image: nginx:1.25
    container_name: nginx_tls
    ports:
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/cert/with-more+3.pem:/etc/nginx/certs/with-more+3.pem
      - ./nginx/cert/with-more+3-key.pem:/etc/nginx/certs/with-more+3-key.pem
    depends_on:
      - app
